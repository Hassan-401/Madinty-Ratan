<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل المنتج — Madinty Ratan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div id="detail"></div>
</div>

<section style="padding-top:10px" id="relatedSec">
  <div class="wrap">
    <div class="sec-head"><h2>منتجات مشابهة</h2></div>
    <div class="grid" id="related"></div>
  </div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderHeader("products");

  const id = new URLSearchParams(location.search).get("id");
  const p  = getProduct(id);

  /* الاختيارات الحالية */
  let qty     = 1;
  let variant = p && p.variants && p.variants.length ? 0 : null;
  let color   = null;

  if (!p) {
    document.getElementById("detail").innerHTML = `
      <div class="empty">
        <div class="ic">😕</div>
        <p>المنتج غير موجود.</p>
        <a class="btn btn-dark" href="products.html">العودة للمنتجات</a>
      </div>`;
    document.getElementById("relatedSec").style.display = "none";
  } else {
    document.title = p.name + " — Madinty Ratan";
    document.getElementById("crumbs").innerHTML =
      `<a href="index.html">الرئيسية</a> / <a href="products.html?cat=${encodeURIComponent(p.cat)}">${esc(catName(p.cat))}</a> / ${esc(p.name)}`;

    /* --- كتل اختيارية حسب بيانات المنتج --- */
    const variantsBlock = !(p.variants && p.variants.length) ? "" : `
      <div class="opt">
        <span class="opt-h">اختر نوع الطقم <b class="req">*</b></span>
        <div class="variants" id="variants">
          ${p.variants.map((v, i) => `
            <button type="button" class="variant${i === 0 ? " on" : ""}" data-i="${i}">
              <b>${esc(v.name)}</b>
              ${v.components && v.components.length ? `<span>${esc(v.components.join(" + "))}</span>` : ""}
              ${v.loadCapacity ? `<span>تتحمل حتى ${esc(v.loadCapacity)}</span>` : ""}
              ${v.price != null ? `<em>${money(v.price)}</em>` : ""}
            </button>`).join("")}
        </div>
      </div>`;

    const colorsBlock = !p.cushions ? "" : `
      <div class="opt">
        <span class="opt-h">لون الشلت <small id="colorName">(اختياري — نرشّحلك في الواتساب لو سِبته)</small></span>
        <div class="swatches" id="swatches">
          ${CUSHION_COLORS.map(c => `
            <button type="button" class="sw" data-id="${c.id}" title="${esc(c.name)}"
                    style="--sw:${c.hex}" aria-label="${esc(c.name)}"></button>`).join("")}
        </div>
      </div>`;

    const listBlock = (title, items) => !items || !items.length ? "" : `
      <div class="opt">
        <span class="opt-h">${title}</span>
        <div class="tags">${items.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      </div>`;

    const dimsBlock = !(p.dims && p.dims.length) ? "" : `
      <div class="opt">
        <span class="opt-h">المقاسات</span>
        <div class="tags">${p.dims.map(d => `<span class="tag">${esc(d.label)}: ${esc(d.value)}</span>`).join("")}</div>
      </div>`;

    const off = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;

    document.getElementById("detail").innerHTML = `
    <div class="p-detail">
      <div class="photo"><img src="${imgURL(p.img)}" alt="${esc(p.name)}"></div>
      <div>
        <span class="cat-tag" style="color:var(--gold);font-weight:600;font-size:13px">${esc(catName(p.cat))}</span>
        <h1>${esc(p.name)}</h1>
        <p class="short">${esc(p.short)}</p>
        <div class="price" id="priceBox"></div>

        ${p.components && p.components.length ? `
          <div class="opt">
            <span class="opt-h">مكونات الطقم</span>
            <div class="tags">${p.components.map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div>
          </div>` : ""}

        ${variantsBlock}
        ${dimsBlock}
        ${listBlock("ألوان الحديد", p.frameColors)}
        ${listBlock("ألوان الجدل", p.weaveColors)}
        ${colorsBlock}
        ${p.colorsNote ? `<p class="note">🎨 ${esc(p.colorsNote)}</p>` : ""}

        <ul class="meta">
          ${p.specs.map(s => `<li>${esc(s)}</li>`).join("")}
          ${p.loadCapacity ? `<li>الحمولة: ${esc(p.loadCapacity)}</li>` : ""}
          ${p.warranty ? `<li>${esc(p.warranty)}</li>` : ""}
        </ul>

        <div class="buy">
          <div class="qty">
            <button type="button" onclick="changeQty(-1)">−</button>
            <span id="q">1</span>
            <button type="button" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn btn-dark" id="addBtn">🛒 أضف للعربة</button>
          <button class="btn btn-gold" id="buyBtn">اطلب الآن</button>
        </div>

        <div class="infobox">
          <div>🚚 ${STORE.freeShipping}</div>
          <div>📦 ${STORE.shippingNote}</div>
          <div>🏭 المصنع: ${STORE.factory}</div>
          <div>💬 للاستفسار واتساب: <a href="https://wa.me/${STORE.whatsapp}" target="_blank" rel="noopener" dir="ltr">${STORE.whatsappDisplay}</a></div>
        </div>
      </div>
    </div>`;

    /* --- السعر يتغيّر مع النوع المختار --- */
    function currentPrice() {
      const v = variant != null && p.variants ? p.variants[variant] : null;
      return v && v.price != null ? v.price : p.price;
    }
    function currentOldPrice() {
      const v = variant != null && p.variants ? p.variants[variant] : null;
      if (v && v.price != null) return v.oldPrice ?? null;
      return p.oldPrice ?? null;
    }
    function paintPrice() {
      const now = currentPrice(), was = currentOldPrice();
      const off = was ? Math.round((1 - now / was) * 100) : 0;
      document.getElementById("priceBox").innerHTML =
        `${money(now)}${was ? `<span class="old">${money(was)}</span>` : ""}` +
        (off ? `<span class="badge" style="position:static;display:inline-block;margin-inline-start:8px">وفر ${off}%</span>` : "");
    }
    paintPrice();

    /* اختيار النوع */
    document.getElementById("variants")?.addEventListener("click", e => {
      const b = e.target.closest(".variant");
      if (!b) return;
      variant = Number(b.dataset.i);
      document.querySelectorAll("#variants .variant")
        .forEach(x => x.classList.toggle("on", x === b));
      paintPrice();
    });

    /* اختيار لون الشلت */
    document.getElementById("swatches")?.addEventListener("click", e => {
      const b = e.target.closest(".sw");
      if (!b) return;
      const picked = Number(b.dataset.id);
      color = color === picked ? null : picked;         /* الضغط تاني يلغي الاختيار */
      document.querySelectorAll("#swatches .sw")
        .forEach(x => x.classList.toggle("on", color != null && Number(x.dataset.id) === color));
      const c = color != null ? colorById(color) : null;
      document.getElementById("colorName").textContent =
        c ? "— " + c.name : "(اختياري — نرشّحلك في الواتساب لو سِبته)";
    });

    document.getElementById("addBtn").addEventListener("click", () =>
      addToCart(p.id, qty, variant, color));
    document.getElementById("buyBtn").addEventListener("click", () => {
      addToCart(p.id, qty, variant, color);
      location.href = "cart.html";
    });

    const rel = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
    if (rel.length) document.getElementById("related").innerHTML = rel.map(productCard).join("");
    else document.getElementById("relatedSec").style.display = "none";
  }

  function changeQty(d) {
    qty = Math.max(1, qty + d);
    document.getElementById("q").textContent = qty;
  }

  renderFooter();
</script>
</body>
</html>
